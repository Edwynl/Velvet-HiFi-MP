<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#574500",
                    "surface-container-high": "#2a2a2c",
                    "secondary-fixed": "#ffe084",
                    "background": "#131316",
                    "on-tertiary-fixed": "#1d1c16",
                    "on-secondary-fixed": "#231b00",
                    "on-primary-fixed": "#241a00",
                    "on-background": "#e5e1e5",
                    "surface-dim": "#131316",
                    "on-surface-variant": "#d0c5b2",
                    "on-error": "#690005",
                    "secondary": "#e3c466",
                    "on-tertiary-fixed-variant": "#494740",
                    "on-tertiary": "#32302a",
                    "on-primary-container": "#503d00",
                    "primary-container": "#c9a84c",
                    "on-error-container": "#ffdad6",
                    "surface-container-lowest": "#0e0e10",
                    "error-container": "#93000a",
                    "error": "#ffb4ab",
                    "tertiary": "#cbc6be",
                    "inverse-on-surface": "#313033",
                    "primary": "#e6c364",
                    "secondary-container": "#735c00",
                    "outline": "#99907e",
                    "inverse-surface": "#e5e1e5",
                    "surface-bright": "#39393b",
                    "primary-fixed-dim": "#e6c364",
                    "secondary-fixed-dim": "#e3c466",
                    "inverse-primary": "#755b00",
                    "on-primary-fixed-variant": "#584400",
                    "surface": "#131316",
                    "surface-container": "#201f22",
                    "tertiary-container": "#afaba3",
                    "on-tertiary-container": "#424039",
                    "tertiary-fixed": "#e7e2d9",
                    "on-secondary-container": "#f6d675",
                    "on-secondary": "#3c2f00",
                    "on-primary": "#3d2e00",
                    "surface-container-low": "#1c1b1e",
                    "primary-fixed": "#ffe08f",
                    "tertiary-fixed-dim": "#cac6bd",
                    "on-surface": "#e5e1e5",
                    "surface-variant": "#353437",
                    "surface-tint": "#e6c364",
                    "outline-variant": "#4d4637",
                    "surface-container-highest": "#353437"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "serif": ["Cormorant Garamond", "serif"],
                    "sans": ["DM Sans", "sans-serif"],
                    "mono": ["DM Mono", "monospace"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(230, 195, 100, 0.3);
        }
        .glass-panel {
            background: rgba(42, 42, 44, 0.4);
            backdrop-filter: blur(20px);
        }
        :root {
            --safe-area-top: env(safe-area-inset-top, 59px);
            --safe-area-bottom: env(safe-area-inset-bottom, 34px);
        }
        body {
            height: 100dvh;
            overflow: hidden;
            background-color: #131316;
        }
        .ios-height-fix {
            height: calc(100dvh - var(--safe-area-top) - var(--safe-area-bottom));
        }
    </style>
</head>
<body class="bg-surface-dim text-on-surface font-sans selection:bg-primary/30">
<!-- Top Navigation Shell - Dynamic Island Aware -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center w-full px-6" style="padding-top: var(--safe-area-top); height: calc(var(--safe-area-top) + 64px);">
<button class="scale-95 active:opacity-80 transition-all text-[#e6c364]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-serif italic text-[#e6c364] text-xl tracking-tight">The Auditory Atelier</h1>
<button class="scale-95 active:opacity-80 transition-all text-[#e6c364]">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<main class="flex flex-col items-center justify-between w-full mx-auto" style="padding-top: calc(var(--safe-area-top) + 64px); padding-bottom: calc(var(--safe-area-bottom) + 100px); height: 100dvh;">
<!-- Centered Album Content -->
<section class="w-full px-8 flex flex-col items-center justify-center flex-grow gap-8">
<!-- Album Art Container - Large and Proportional -->
<div class="relative group w-full max-w-[380px] aspect-square">
<div class="absolute inset-0 bg-primary/20 blur-[80px] rounded-full scale-95 -z-10 opacity-60"></div>
<img alt="Artistic album cover" class="w-full h-full object-cover rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] ring-1 ring-white/10" data-alt="Moody cinematic close-up of a vintage vinyl record player needle on a spinning gold-flecked black record with warm amber lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9OK_fLdOtzKMFmgHq8AFa7_B3zdhyqOQ4ZjQWmcfOAU9qFLOnb6Hq8awLfl7vmLxBHAryBZTmWoubJgPu6xOKkiHjx4vrPiWkjVFM7b_pm1qhNxAfpUXNZXB4mvQQChaGXlsM0ia99uxLW4bIi3T7FSr71Svw9Y6qDPgOdbykTrnW3pXeSgZgsIpO432ja-DA4WM9MuG2dOoSSOMtfO12ZDcTOJSGfUp7Oy9ANG89wUPmVQ4XdKJVTl7zXRBHEH9ze07vd5dpqkN0"/>
<!-- Hi-Res Badge -->
<div class="absolute top-4 right-4 bg-black/40 backdrop-blur-xl px-3 py-1 rounded-full ring-1 ring-primary/30 flex items-center gap-2">
<span class="font-mono text-[10px] tracking-tighter text-primary">24-bit / 192kHz</span>
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
</div>
</div>
<!-- Track Info - Ergonomic placement -->
<div class="w-full max-w-[380px] space-y-1">
<div class="flex justify-between items-center w-full">
<h2 class="font-serif text-4xl font-semibold text-on-surface tracking-tight leading-tight">Midnight Velvet</h2>
<button class="text-primary/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="favorite">favorite</span>
</button>
</div>
<div class="flex items-center gap-3">
<p class="font-sans text-on-surface-variant text-lg font-medium opacity-80">Elias Thorne</p>
<span class="w-1 h-1 rounded-full bg-outline-variant/50"></span>
<span class="font-mono text-[11px] uppercase tracking-widest text-primary/90 bg-primary/10 px-2 py-0.5 rounded border border-primary/20">High-Res</span>
</div>
</div>
</section>
<!-- Ergonomic Controls Section (Thumb zone) -->
<section class="w-full px-8 pb-4 space-y-8">
<!-- Progress Bar -->
<div class="w-full space-y-3">
<div class="relative w-full h-1.5 bg-surface-container-highest/40 rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full w-[42%] bg-gradient-to-r from-primary/60 to-primary shadow-[0_0_12px_rgba(230,195,100,0.4)]"></div>
</div>
<div class="flex justify-between font-mono text-[11px] text-on-surface-variant/80 tracking-widest">
<span>01:42</span>
<span>04:08</span>
</div>
</div>
<!-- Main Playback Controls -->
<div class="flex justify-between items-center w-full px-2">
<button class="text-on-surface-variant/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="shuffle">shuffle</span>
</button>
<div class="flex items-center gap-10">
<button class="text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl" data-icon="skip_previous">skip_previous</span>
</button>
<button class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-2xl shadow-primary/20 active:scale-95 transition-all">
<span class="material-symbols-outlined text-5xl" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl" data-icon="skip_next">skip_next</span>
</button>
</div>
<button class="text-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="repeat">repeat</span>
</button>
</div>
<!-- Secondary Utility Controls -->
<div class="flex justify-around items-center pt-2">
<button class="flex flex-col items-center gap-1.5 opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-xl" data-icon="lyrics">lyrics</span>
<span class="font-sans text-[10px] uppercase tracking-widest font-medium">Lyrics</span>
</button>
<button class="flex flex-col items-center gap-1.5 opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-xl" data-icon="playlist_play">playlist_play</span>
<span class="font-sans text-[10px] uppercase tracking-widest font-medium">Queue</span>
</button>
<button class="flex flex-col items-center gap-1.5 opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-xl" data-icon="cast">cast</span>
<span class="font-sans text-[10px] uppercase tracking-widest font-medium">Connect</span>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation Shell - Home Indicator Aware -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-8 z-50 bg-[#0e0e10]/90 backdrop-blur-2xl rounded-t-[40px] border-t border-white/5" style="padding-bottom: calc(var(--safe-area-bottom) + 12px); height: calc(var(--safe-area-bottom) + 84px);">
<button class="flex flex-col items-center justify-center text-[#7a7469] p-3 hover:text-[#ede8df]">
<span class="material-symbols-outlined" data-icon="home">home</span>
</button>
<button class="flex flex-col items-center justify-center text-[#e6c364] bg-[#2a2a2c] rounded-2xl p-3 Active: scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="library_music" style="font-variation-settings: 'FILL' 1;">library_music</span>
</button>
<button class="flex flex-col items-center justify-center text-[#7a7469] p-3 hover:text-[#ede8df]">
<span class="material-symbols-outlined" data-icon="equalizer">equalizer</span>
</button>
<button class="flex flex-col items-center justify-center text-[#7a7469] p-3 hover:text-[#ede8df]">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</nav>
</body></html>
