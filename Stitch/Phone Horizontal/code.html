<body class="flex items-center justify-center min-h-screen">

<main class="device-canvas w-full bg-surface-container-lowest overflow-hidden flex flex-col relative">

<header class="fixed top-0 w-full z-50 flex justify-between items-center px-12 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#7a7469] hover:opacity-80 transition-opacity cursor-pointer">keyboard_arrow_down</span>

</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2 bg-[#2a2a2c] px-3 py-1 rounded-full">

<span class="material-symbols-outlined text-[14px] text-[#e6c364]">expand_more</span>
</div>
<div class="flex items-center gap-2 bg-[#2a2a2c] px-3 py-1 rounded-full">
<span class="text-[10px] font-mono tracking-tighter text-[#7a7469] uppercase">DSP</span>
<span class="material-symbols-outlined text-[14px] text-[#e6c364]">tune</span>
</div>
<span class="material-symbols-outlined text-[#e6c364] hover:opacity-80 transition-opacity cursor-pointer">settings_input_component</span>
</div>
</header>
<!-- Main Player Split Screen -->
<section class="flex-1 flex items-center px-16 pt-12 pb-8 gap-16">

<div class="w-1/2 flex justify-center items-center">

</div>
</div>

<h1 class="font-headline text-4xl lg:text-5xl tracking-tight text-[#ede8df]">Midnight Velvet</h1>
<p class="font-sans text-xl text-[#7a7469] tracking-wide">Elias Thorne</p>
<div class="flex items-center gap-3 pt-2">
<div class="border border-[#e6c364]/20 px-2 py-0.5 rounded text-[10px] font-mono text-[#e6c364] uppercase tracking-widest bg-[#e6c364]/5">
                            HI-RES
                        </div>
<span class="font-mono text-[11px] text-[#7a7469]">24-bit / 192kHz • ALAC</span>
</div>
</div>
<!-- Controls Cluster -->
<div class="flex items-center gap-10">
<span class="material-symbols-outlined text-[#7a7469] hover:text-[#e6c364] transition-colors cursor-pointer text-2xl">shuffle</span>
<div class="flex items-center gap-8">
<span class="material-symbols-outlined text-[#ede8df] text-3xl active:scale-90 transition-transform cursor-pointer">skip_previous</span>
<div class="w-16 h-16 rounded-full bg-gradient-to-br from-[#e6c364] to-[#c9a84c] flex items-center justify-center text-[#131316] shadow-lg active:scale-95 transition-all cursor-pointer">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<span class="material-symbols-outlined text-[#ede8df] text-3xl active:scale-90 transition-transform cursor-pointer">skip_next</span>
</div>
<span class="material-symbols-outlined text-[#7a7469] hover:text-[#e6c364] transition-colors cursor-pointer text-2xl">repeat</span>
</div>

<div class="flex items-center gap-4 w-48">
<span class="material-symbols-outlined text-[#7a7469] text-sm">volume_mute</span>

<span class="material-symbols-outlined text-[#7a7469] text-xl">favorite</span>
<span class="material-symbols-outlined text-[#7a7469] text-xl">playlist_add</span>
</div>
</div>
</div>

<div class="flex justify-between px-6 mb-1">
<span class="font-mono text-[10px] text-[#7a7469]">02:14</span>
<span class="font-mono text-[10px] text-[#7a7469]">-01:42</span>
</div>
<div class="thin-progress-bar w-full">
<div class="thin-progress-fill w-[58%]"></div>
</div>

<div class="h-6 w-full flex justify-center items-end pb-1">
<div class="w-32 h-1 bg-[#ede8df]/20 rounded-full"></div>
</div>
