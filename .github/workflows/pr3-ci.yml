name: PR3 Architecture and Library CI

on:
  push:
    branches: [perf/frontend-pwa-library-pr3]
  pull_request:
    branches: [fix/auth-boundaries-and-soxr-resampling, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Database and API tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full --no-progress -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: python -m compileall -q .
      - run: python -m pytest tests -q

  frontend:
    name: Frontend and PWA tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:frontend
