name: Audio Signal Path CI

on:
  pull_request:
    paths:
      - 'server.py'
      - 'static/index.html'
      - 'tests/**'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/audio-signal-path.yml'
  push:
    branches:
      - feat/android-usb-audio-signal-path

jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_server_api.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:frontend
