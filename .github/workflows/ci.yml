name: VELVET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python API and audio regression tests
    strategy:
      matrix:
        os: [windows-latest]  # Windows is the supported server runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full --no-progress -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Compile Python source
        run: python -m compileall -q -x 'venv|\.venv' .
      - name: Run regression suite
        env:
          VELVET_AUTH_ENFORCE_ALL_NETWORKS: 'true'
        run: python -m pytest tests -q

  windows-install:
    name: Windows installer and native audio detection
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the user-facing installer path
        shell: pwsh
        run: .\install.ps1 -SkipNode
      - name: Native audio must be importable from the installed venv
        shell: pwsh
        run: |
          .\venv\Scripts\python.exe -c "import local_playback as lp; assert lp.SOUNDDEVICE_AVAILABLE, lp.SOUNDDEVICE_ERROR; print('sounddevice', lp.sd.__version__, lp.sd.get_portaudio_version()[1])"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  frontend:
    name: Frontend regression tests
    strategy:
      matrix:
        os: [windows-latest]  # Windows is the supported server runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
